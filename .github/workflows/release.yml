name: Release

# Publica una Release con los paquetes de Linux y Windows al subir una etiqueta vX.Y.Z:
#   git tag v0.1.3 && git push origin v0.1.3
# La etiqueta debe coincidir con info.productVersion de wails.json y VERSION del Makefile.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

env:
  WAILS_VERSION: v2.17.0
  NFPM_VERSION: v2.48.0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: La etiqueta coincide con la versión del proyecto
        run: |
          v="${GITHUB_REF_NAME#v}"
          w=$(sed -n 's/.*"productVersion": *"\([^"]*\)".*/\1/p' wails.json)
          m=$(sed -n 's/^VERSION ?= *//p' Makefile)
          [ "$v" = "$w" ] && [ "$v" = "$m" ] || { echo "etiqueta=$v wails.json=$w Makefile=$m"; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # main.go embebe frontend/dist, que no está en el repo: se compila antes de los tests de Go.
      - run: cd frontend && npm ci && npm run check && npm test && npm run build
      - run: make test

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}
      - run: make package-linux VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y nsis zip
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - run: make package-windows VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Plutón SQL ${GITHUB_REF_NAME#v}" --generate-notes
